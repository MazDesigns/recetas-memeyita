<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f1e7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Memeyita">
<title>Recetas de Memeyita</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  /* Cocina de familia: crema cálido, verde hoja profundo, lima como acento de acción.
     Layout: inicio = filtros + rejilla de tarjetas; receta = cabecera visual, ingredientes en fichas, pasos numerados. */
  --bg: #f6f1e7;
  --surface: #efe7d8;
  --card: #fbf8f2;
  --ink: #1f2a1c;
  --muted: #6b6f5f;
  --green: #2f4a2a;
  --green-soft: #dfe6d3;
  --lime: #d9ef5b;
  --line: #e2d8c5;
  --display: "Fraunces", Georgia, "Times New Roman", serif;
  --body: "Outfit", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 18px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.5;
}
h1, h2, h3 { font-family: var(--display); font-weight: 600; text-wrap: balance; margin: 0; line-height: 1.1; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--green); outline-offset: 2px; border-radius: 8px; }
img { max-width: 100%; }

.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(20px, env(safe-area-inset-left)); padding-right: max(20px, env(safe-area-inset-right)); }

/* Barra superior */
.top { border-bottom: 1px solid var(--line); background: var(--bg); position: sticky; top: 0; z-index: 5; padding-top: env(safe-area-inset-top); }
.top .wrap { display: flex; align-items: center; justify-content: space-between; height: 64px; gap: 16px; }
.brand { font-family: var(--display); font-size: 1.35rem; color: var(--green); text-decoration: none; font-weight: 600; }
.brand small { display: block; font-family: var(--body); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.sections { display: flex; gap: 4px; background: var(--surface); border-radius: 999px; padding: 4px; }
.sections a { text-decoration: none; color: var(--muted); font-size: .9rem; padding: 6px 14px; border-radius: 999px; }
.sections a[aria-current="page"] { background: var(--green); color: #fff; }
.aviso { margin: 0 0 8px; padding: 12px 16px; background: #fbf3d6; border: 1px solid #ecdfae; border-radius: 14px; font-size: .9rem; color: #5b5434; }
.recipe .aviso { margin: 0; }
.xcard p.solo { color: var(--ink); font-size: .98rem; }

/* Inicio */
.hero { padding-top: 48px; padding-bottom: 28px; display: grid; grid-template-columns: 1.2fr 1fr; gap: 32px; align-items: end; }
.hero h1 { font-size: clamp(2.2rem, 5vw, 3.6rem); color: var(--green); font-weight: 400; }
.hero h1 em { font-style: italic; font-weight: 600; }
.hero p { color: var(--muted); max-width: 46ch; margin: 14px 0 0; font-size: 1.05rem; }
.search { display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 12px 18px; }
.search input { border: 0; background: transparent; font: inherit; flex: 1; min-width: 0; color: var(--ink); outline: none; }
.search:focus-within { border-color: var(--green); }

.filters { display: flex; flex-direction: column; gap: 14px; padding-top: 8px; padding-bottom: 24px; }
.tabs { display: flex; gap: 22px; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
.tab { background: none; border: 0; padding: 8px 0 12px; font-family: var(--display); font-size: 1.35rem; color: #a9a593; border-bottom: 3px solid transparent; margin-bottom: -1px; }
.tab[aria-pressed="true"] { color: var(--ink); border-color: var(--green); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.chips span { font-size: .85rem; color: var(--muted); margin-right: 4px; }
.chip { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 14px; font-size: .9rem; }
.chip[aria-pressed="true"] { background: var(--green); color: #fff; border-color: var(--green); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 22px; padding-bottom: 48px; }
.card { background: none; border: 0; padding: 0; text-align: left; display: flex; flex-direction: column; gap: 12px; }
.card .pic { border-radius: var(--r); aspect-ratio: 5 / 4; display: grid; place-items: center; position: relative; transition: transform .2s; }
.card:hover .pic { transform: translateY(-3px); }
.card h3 { font-size: 1.3rem; }
.card p { margin: 0; color: var(--muted); font-size: .92rem; }
.meta { display: flex; gap: 14px; flex-wrap: wrap; font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.badge { position: absolute; top: 12px; left: 12px; background: var(--lime); color: var(--ink); font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; font-weight: 600; padding: 4px 10px; border-radius: 999px; }
.badge.video { left: auto; right: 12px; background: var(--green); color: #fff; }
.empty { grid-column: 1 / -1; text-align: center; padding: 40px; color: var(--muted); }

/* Plato ilustrado */
.plate { width: 66%; aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center;
  background: radial-gradient(circle, #fffdf8 0 58%, #f1ebdf 59% 66%, #fffdf8 67% 100%);
  box-shadow: 0 18px 30px -14px rgba(47, 74, 42, .45), 0 2px 0 rgba(0,0,0,.03); }
.plate span { font-size: clamp(3rem, 8vw, 5rem); line-height: 1; }
.plate img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }

/* Receta */
.recipe { padding-top: 20px; padding-bottom: 64px; display: flex; flex-direction: column; gap: 22px; }
.back { display: inline-flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px; font-size: .9rem; align-self: flex-start; }
.rhead { background: var(--card); border-radius: 28px; padding: 32px; display: grid; grid-template-columns: 1fr 1fr; gap: 28px; align-items: center; }
.rhead h1 { font-size: clamp(2rem, 4.5vw, 3.2rem); color: var(--green); }
.rhead .desc { color: var(--muted); max-width: 42ch; margin: 14px 0 18px; }
.rhead .pic { border-radius: 24px; aspect-ratio: 1; display: grid; place-items: center; }
.rhead .pic .plate { width: 78%; }
.facts { display: flex; flex-wrap: wrap; gap: 10px; }
.fact { background: var(--surface); border-radius: 12px; padding: 8px 14px; font-size: .9rem; }
.fact b { display: block; font-size: .7rem; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.note { margin: 18px 0 0; padding: 14px 18px; border-left: 3px solid var(--lime); background: var(--surface); border-radius: 0 12px 12px 0; font-family: var(--display); font-style: italic; font-size: 1.05rem; }
.note small { display: block; font-family: var(--body); font-style: normal; font-size: .8rem; color: var(--muted); margin-top: 4px; }
.sample { display: inline-block; font-size: .75rem; color: var(--muted); border: 1px dashed var(--muted); border-radius: 999px; padding: 2px 10px; margin-bottom: 12px; }

.panel { background: var(--card); border-radius: 24px; padding: 24px; }
.phead { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.phead h2 { font-size: 1.6rem; }
.phead .sub { font-size: .85rem; color: var(--muted); font-family: var(--body); font-weight: 400; margin-left: 8px; }
.servings { display: flex; align-items: center; gap: 4px; background: var(--surface); border-radius: 999px; padding: 4px; }
.servings button { width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--card); font-size: 1.1rem; }
.servings output { min-width: 96px; text-align: center; font-size: .9rem; font-variant-numeric: tabular-nums; }

.ings { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 12px; }
.ing { position: relative; background: var(--surface); border: 2px solid transparent; border-radius: 16px; padding: 16px 10px 12px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.ing .e { font-size: 2.4rem; line-height: 1.1; }
.ing .q { font-weight: 600; font-variant-numeric: tabular-nums; font-size: .95rem; }
.ing .n { font-size: .85rem; color: var(--muted); line-height: 1.3; }
.ing .tick { position: absolute; top: 8px; left: 8px; width: 22px; height: 22px; border-radius: 50%; border: 2px solid #c9bfa9; display: grid; place-items: center; font-size: .75rem; color: #fff; }
.ing[aria-pressed="true"] { border-color: var(--green); background: var(--green-soft); }
.ing[aria-pressed="true"] .tick { background: var(--green); border-color: var(--green); }

.map { display: flex; gap: 0; overflow-x: auto; padding: 4px 2px 14px; margin-bottom: 8px; }
.map button { flex: 1 0 104px; background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; position: relative; padding: 0 4px; font-size: .8rem; color: var(--muted); text-align: center; }
.map button::after { content: ""; position: absolute; top: 28px; left: calc(50% + 32px); right: calc(-50% + 32px); border-top: 2px dotted #c9bfa9; }
.map button:last-child::after { display: none; }
.map .dot { width: 56px; height: 56px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; font-size: 1.6rem; position: relative; }
.map .dot i { position: absolute; top: -4px; left: -4px; width: 22px; height: 22px; border-radius: 50%; background: var(--green); color: #fff; font-style: normal; font-size: .72rem; font-weight: 600; display: grid; place-items: center; }
.map button.done .dot { background: var(--green-soft); }

.steps { display: flex; flex-direction: column; gap: 12px; }
.step { display: grid; grid-template-columns: 56px 1fr auto; gap: 16px; align-items: start; background: var(--surface); border-radius: 16px; padding: 16px; border: 2px solid transparent; text-align: left; width: 100%; }
.step .num { width: 56px; height: 56px; border-radius: 14px; background: var(--card); display: grid; place-items: center; font-size: 1.7rem; position: relative; }
.step .num i { position: absolute; bottom: -6px; right: -6px; width: 24px; height: 24px; border-radius: 50%; background: var(--green); color: #fff; font-style: normal; font-size: .75rem; font-weight: 600; display: grid; place-items: center; }
.step h3 { font-family: var(--body); font-size: 1.05rem; font-weight: 600; margin-bottom: 4px; }
.step p { margin: 0; color: #3e4536; max-width: 65ch; }
.step .time { font-size: .8rem; background: var(--card); border-radius: 999px; padding: 4px 10px; white-space: nowrap; color: var(--muted); font-variant-numeric: tabular-nums; }
.step[aria-pressed="true"] { border-color: var(--green); background: var(--green-soft); }
.step[aria-pressed="true"] h3 { text-decoration: line-through; text-decoration-color: rgba(47,74,42,.5); }
.hint { font-size: .82rem; color: var(--muted); margin: 0 0 12px; }

.video { display: grid; grid-template-columns: 1fr 1.4fr; gap: 20px; align-items: center; }
.vbox { aspect-ratio: 16 / 9; border-radius: 16px; background: repeating-linear-gradient(-45deg, var(--surface) 0 14px, #e9e0cf 14px 28px); display: grid; place-items: center; text-align: center; color: var(--muted); padding: 16px; }
.vbox .play { width: 64px; height: 64px; border-radius: 50%; background: var(--card); display: grid; place-items: center; margin: 0 auto 8px; font-size: 1.4rem; color: var(--green); }
.btn { display: inline-flex; align-items: center; gap: 10px; background: var(--green); color: #fff; text-decoration: none; border-radius: 999px; padding: 12px 20px; font-weight: 500; }
.tags { display: flex; justify-content: center; gap: 28px; flex-wrap: wrap; background: var(--surface); border-radius: 999px; padding: 14px 20px; font-size: .9rem; color: var(--green); }

.grp { grid-column: 1 / -1; font-family: var(--body); font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin: 10px 0 0; }
.grp:first-child { margin-top: 0; }
.xgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.xcard { display: flex; gap: 14px; align-items: flex-start; background: var(--surface); border-radius: 16px; padding: 16px; }
.xcard .e { font-size: 1.8rem; line-height: 1; width: 48px; height: 48px; flex: none; display: grid; place-items: center; background: var(--card); border-radius: 12px; }
.xcard h3 { font-family: var(--body); font-size: 1rem; font-weight: 600; margin-bottom: 4px; }
.xcard p { margin: 0; color: #3e4536; font-size: .93rem; }
.trucos { padding-bottom: 48px; display: flex; flex-direction: column; gap: 16px; }
.trucos h2 { font-size: 1.6rem; color: var(--green); }

footer { border-top: 1px solid var(--line); padding-top: 24px; padding-bottom: calc(40px + env(safe-area-inset-bottom)); color: var(--muted); font-size: .85rem; }

@media (max-width: 760px) {
  .hero, .rhead, .video { grid-template-columns: 1fr; }
  .hero { padding-top: 32px; }
  .rhead { padding: 22px; }
  .rhead .pic { order: -1; aspect-ratio: 4 / 3; }
  .step { grid-template-columns: 48px 1fr; }
  .step .num { width: 48px; height: 48px; }
  .step .time { grid-column: 2; justify-self: start; }
  .panel { padding: 18px; }
  .tags { border-radius: 18px; }
  .brand { font-size: 1.12rem; white-space: nowrap; }
  .brand small { font-size: .62rem; }
  .sections a { padding: 6px 11px; font-size: .85rem; }
  .tabs { flex-wrap: nowrap; overflow-x: auto; gap: 18px; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { font-size: 1.15rem; white-space: nowrap; flex: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="brand" href="#">Recetas de Memeyita<small>Cocina de familia</small></a>
    <nav class="sections" aria-label="Secciones"><a href="#" data-sec="recetas">Recetas</a><a href="#remedios" data-sec="remedios">Remedios</a></nav>
  </div>
</header>

<main id="app"></main>

<footer>
  <div class="wrap">Recetas de mamá, de la abuela y de quienes han pasado por nuestra cocina, transcritas de las hojas originales. Los remedios caseros son sabiduría popular y no sustituyen la consulta médica.</div>
</footer>

<script>
/* ==========================================================
   CÓMO AGREGAR UNA RECETA
   Copia un bloque { ... } de la lista RECETAS y cambia los datos.
   - id: palabra corta sin espacios ni acentos (se usa en el enlace: #pan)
   - categoria: "Panes" | "Dulces" | "Platos fuertes" | (o crea otra)
   - de: quién la trae, por ejemplo "Mamá", "Abuela" o "La familia"
   - tiempoTexto / porcionesTexto: cómo se muestran el tiempo y las porciones
   - porciones: número (si lo pones, las cantidades se ajustan por porción)
   - ingredientes: c = cantidad (null = "al gusto", [1.5, 2] = rango)
                   g = título de grupo (se pone en el primer ingrediente del grupo)
   - extras: secciones como "Consejos", "Cubiertas" o "Variaciones"
   - video: enlace de YouTube cuando lo grabes (déjalo "" mientras tanto)
   - foto: opcional; ruta a una foto del plato (ej. "fotos/pan.jpg")
   ========================================================== */
const RECETAS = [
  {
    id: "pan", titulo: "Pan (masa básica)", categoria: "Panes", de: "La familia",
    plato: "🍞", color: "#ead9b8", tiempoTexto: "1 h 15 min + horneado", dificultad: "Media",
    descripcion: "La masa de la casa. Sirve para panes salados y dulces, roscas de frutas, cachitos y pan de jamón.",
    nota: "La hoja original no indica la temperatura ni el tiempo de horneado, ni la cantidad de sal.",
    ingredientes: [
      { e: "🌾", n: "Harina", c: [1.5, 2], u: "kg" },
      { e: "🧈", n: "Mantequilla", c: 200, u: "g" },
      { e: "🫒", n: "Aceite", c: 1, u: "taza" },
      { e: "🫧", n: "Levadura fresca (prensada en pasta)", c: 2, u: "cda" },
      { e: "🍬", n: "Azúcar", c: 2, u: "cda" },
      { e: "💧", n: "Agua tibia", c: 2, u: "taza" },
      { e: "🥛", n: "Leche", c: 2, u: "taza" },
      { e: "🥚", n: "Huevos", c: 4, u: "" },
      { e: "🧂", n: "Sal", c: null, u: "al gusto" }
    ],
    pasos: [
      { e: "🫧", t: "Activar la levadura", d: "Disuelve la levadura en el agua tibia con las 2 cucharadas de azúcar. Tapa y deja reposar.", min: 10 },
      { e: "🥣", t: "Batir la base", d: "Aparte, bate la mantequilla con el aceite, el azúcar y los huevos. Agrega la sal, la leche y el agua con la levadura." },
      { e: "🌾", t: "Agregar la harina", d: "Ve agregando la harina mientras bates, hasta que la masa se pegue a la batidora. Entonces amasa a mano hasta que quede suave y algo pegajosa." },
      { e: "⏳", t: "Dejar reposar", d: "Tapada, en un envase engrasado y en un lugar tibio.", min: 60 },
      { e: "🥖", t: "Formar los panes", d: "Divide la masa y forma los panes. Se pueden congelar ya formados, o la masa dividida y envasada." }
    ],
    extras: [
      { titulo: "Consejos", items: [
        { e: "🖌️", t: "Para pintar el pan", d: "Agua de papelón espesita con un huevo batido, o solo leche." },
        { e: "❄️", t: "Para descongelar la masa", d: "Sácala del congelador en la noche y pásala a la nevera." }
      ]},
      { titulo: "Formas y variaciones", items: [
        { e: "🥐", t: "Croissant", d: "Estira la masa, pon una cucharada de mantequilla, dobla y guarda ½ hora en la nevera. Repite 3 veces. Al final corta en triángulos, enrolla y dobla en media luna." },
        { e: "🌀", t: "Pan de canela", d: "Estira un rectángulo y cúbrelo con canela y azúcar. Dobla, vuelve a estirar y pon otra capa. Dobla en 4, cubre con más canela y azúcar y barniza con leche." },
        { e: "🧄", t: "Pan de ajo", d: "Mantequilla con ajo machacado." },
        { e: "🌰", t: "Pan de especias", d: "Clavo o pimienta guayabita, canela, nueces, pasas y azúcar." },
        { e: "🥨", t: "Pan crineja (trenza)", d: "Teje 3 tiras. Barniza con huevo y papelón, o con leche y huevo." },
        { e: "🎀", t: "Pan de 2 tiras", d: "Teje 2 tiras y rellena con mantequilla o mermelada. (El nombre no se lee bien en la hoja original.)" },
        { e: "🍕", t: "Calzone", d: "Relleno de salchichón, tomate, mozzarella y jamón." },
        { e: "🍩", t: "Rosca", d: "Relleno de canela y azúcar, mermelada, chocolate rallado o frutina. Enrolla y cierra en anillo." },
        { e: "✚", t: "Pan campesino", d: "Con un corte en cruz encima." }
      ]}
    ],
    video: ""
  },
  {
    id: "torta-zanahoria", titulo: "Torta de zanahoria o calabacín", categoria: "Dulces", de: "La familia",
    plato: "🥕", color: "#f0d2a8", tiempoTexto: "40 min de horno", dificultad: "Fácil",
    descripcion: "Torta húmeda y especiada que funciona igual con zanahoria o con calabacín. Se puede congelar horneada o sin hornear.",
    nota: "La hoja dice “300°”. Lo tomamos como 300 °F, unos 150 °C, porque 300 °C es demasiado para un horno de casa.",
    ingredientes: [
      { e: "🥕", n: "Zanahoria o calabacín finamente rallado", c: 3, u: "taza" },
      { e: "🌾", n: "Harina sin leudante", c: 2, u: "taza" },
      { e: "🫒", n: "Aceite", c: 1.25, u: "taza" },
      { e: "🥚", n: "Huevos", c: 4, u: "" },
      { e: "🍬", n: "Azúcar", c: 2, u: "taza" },
      { e: "🟤", n: "Canela", c: 1, u: "cdta" },
      { e: "🌿", n: "Clavo o pimienta guayabita", c: 1, u: "cdta" },
      { e: "🥄", n: "Bicarbonato", c: 2, u: "cdta" },
      { e: "🥜", n: "Opcional: nueces, pasas o piña picada (pasadas por harina)", c: 1, u: "taza" }
    ],
    pasos: [
      { e: "🥚", t: "Batir huevos y azúcar", d: "Bate los huevos con el azúcar y agrega el aceite." },
      { e: "🌾", t: "Agregar los secos", d: "Mezcla los ingredientes secos y agrégalos poco a poco a la preparación anterior." },
      { e: "🥕", t: "Añadir la zanahoria", d: "Añade la zanahoria o el calabacín y mezcla bien. Por último, el ingrediente opcional (o 100 g de almendra molida)." },
      { e: "🔥", t: "Hornear", d: "Pon la mezcla en un envase engrasado y hornea a 150–175 °C.", min: 40 }
    ],
    extras: [
      { titulo: "Cubiertas", items: [
        { e: "🍋", t: "Sencilla", d: "Jugo de 1 limón, agregando azúcar glas (nevazúcar) hasta que quede brillante." },
        { e: "✨", t: "De lujo", d: "1 queso crema Philadelphia y el jugo de 1 limón (2 si el queso es grande), agregando azúcar glas hasta punto cremoso." }
      ]}
    ],
    video: ""

      { e: "🍄", d: "Acaba con los hongos que afectan tus plantas." },
      { e: "🧰", d: "Para limpiar herramientas de jardinería." },
      { e: "🌾", d: "Evita que crezcan malas hierbas alrededor de tus plantas." },
      { e: "🪰", d: "Sirve para eliminar las moscas en el jardín." },
      { e: "🐶", d: "Repelente natural para que las mascotas no hagan pipí en el jardín." },
      { e: "🐜", d: "Aleja a las hormigas del jardín." }
    ]}]
  }
];

const SECCIONES = {
  recetas: {
    items: RECETAS, href: "#", volver: "← Todas las recetas", palabra: "recetas",
    titulo: `Lo que se cocina <em>en casa</em>, guardado para siempre.`,
    intro: "Las recetas de mamá, de la abuela y las que hemos ido sumando en el camino, paso a paso y con cada ingrediente a la vista.",
    buscar: "Busca una receta o un ingrediente"
  },
  remedios: {
    items: REMEDIOS, href: "#remedios", volver: "← Todos los remedios", palabra: "remedios",
    titulo: `Remedios <em>caseros</em> que se pasan de mano en mano.`,
    intro: "Mascarillas, hierbas y trucos para las plantas que hemos ido guardando en familia.",
    buscar: "Busca un remedio o una hierba"
  }
};
const seccionDe = r => REMEDIOS.includes(r) ? "remedios" : "recetas";
const ORIGENES = [...new Set(RECETAS.map(r => r.de).filter(Boolean))];

const state = { recetas: { cat: "Todas", q: "" }, remedios: { cat: "Todas", q: "" }, de: null, servings: {}, checks: {} };
try { Object.assign(state.checks, JSON.parse(localStorage.getItem("memeyita-checks") || "{}")); } catch (e) {}
function saveChecks() { try { localStorage.setItem("memeyita-checks", JSON.stringify(state.checks)); } catch (e) {} }

const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const tiempo = m => m >= 60 ? `${Math.floor(m / 60)} h${m % 60 ? " " + (m % 60) + " min" : ""}` : `${m} min`;
const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();

function fmt(n) {
  const whole = Math.floor(n + 1e-9), frac = n - whole;
  const fr = [[0, ""], [0.25, "¼"], [1 / 3, "⅓"], [0.5, "½"], [2 / 3, "⅔"], [0.75, "¾"], [1, ""]];
  let best = fr[0];
  for (const f of fr) if (Math.abs(frac - f[0]) < Math.abs(frac - best[0])) best = f;
  if (n >= 20) return String(Math.round(n));
  const w = best[0] === 1 ? whole + 1 : whole;
  if (Math.abs(frac - best[0]) > 0.09) return n.toFixed(1).replace(".", ",");
  return (w ? w : "") + best[1] || "0";
}

const tiempoDe = r => r.tiempoTexto || (r.tiempo ? tiempo(r.tiempo) : "");
const porcDe = r => r.porcionesTexto || r.porciones || "";
const PLURAL = { taza: "tazas", cda: "cdas", cdta: "cdtas", diente: "dientes", lata: "latas", rodaja: "rodajas", limón: "limones" };
function cantidad(g, k) {
  if (g.c == null) return esc(g.u);
  const hi = Array.isArray(g.c) ? g.c[1] * k : g.c * k;
  const num = Array.isArray(g.c) ? `${fmt(g.c[0] * k)} a ${fmt(g.c[1] * k)}` : fmt(g.c * k);
  const u = g.u ? (hi > 1 && PLURAL[g.u] ? PLURAL[g.u] : g.u) : "";
  return num + (u ? " " + esc(u) : "");
}

function ytEmbed(url) {
  if (!url) return "";
  const m = url.match(/(?:youtu\.be\/|v=|shorts\/|embed\/)([\w-]{11})/);
  return m ? `https://www.youtube-nocookie.com/embed/${m[1]}` : "";
}

function plato(r) {
  return `<div class="plate">${r.foto ? `<img src="${esc(r.foto)}" alt="${esc(r.titulo)}">` : `<span aria-hidden="true">${r.plato}</span>`}</div>`;
}

const xcards = items => `<div class="xgrid">${items.map(it => `<div class="xcard"><span class="e" aria-hidden="true">${it.e}</span><div>${it.t ? `<h3>${esc(it.t)}</h3>` : ""}${it.d ? `<p${it.t ? "" : ' class="solo"'}>${esc(it.d)}</p>` : ""}</div></div>`).join("")}</div>`;

function avisoDe(r) {
  if (r.categoria === "Para la piel") return AVISO_SALUD + " Prueba primero en una zona pequeña de la piel, y evita el sol después de usar limón o naranja en la cara.";
  if (r.categoria === "Hierbas medicinales") return AVISO_SALUD + " Si estás embarazada, tomas medicamentos o tienes alguna condición de salud, consulta antes de usarlas.";
  return "";
}

function setNav(sec) {
  document.querySelectorAll(".sections a").forEach(a => {
    if (a.dataset.sec === sec) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  });
}

function textoBusqueda(r) {
  return [r.titulo, r.descripcion, r.categoria,
    ...(r.ingredientes || []).map(i => i.n),
    ...(r.extras || []).flatMap(x => x.items.map(it => (it.t || "") + " " + (it.d || "")))].join(" ");
}

function renderList(sec) {
  const S = SECCIONES[sec], st = state[sec];
  const cats = ["Todas", ...new Set(S.items.map(r => r.categoria))];
  const q = norm(st.q);
  const list = S.items.filter(r =>
    (st.cat === "Todas" || r.categoria === st.cat) &&
    (sec !== "recetas" || !state.de || r.de === state.de) &&
    (!q || norm(textoBusqueda(r)).includes(q))
  );
  app.innerHTML = `
    <section class="wrap hero">
      <div>
        <h1>${S.titulo}</h1>
        <p>${S.intro}</p>
      </div>
      <label class="search" for="q">
        <span aria-hidden="true">🔎</span>
        <input id="q" type="search" placeholder="${S.buscar}" value="${esc(st.q)}">
      </label>
    </section>
    ${sec === "remedios" ? `<div class="wrap"><p class="aviso">${AVISO_SALUD}</p></div>` : ""}
    <section class="wrap filters" aria-label="Filtros">
      <div class="tabs" role="group" aria-label="Categoría">
        ${cats.map(c => `<button class="tab" data-cat="${esc(c)}" aria-pressed="${st.cat === c}">${esc(c)}</button>`).join("")}
      </div>
      ${sec === "recetas" && ORIGENES.length > 1 ? `<div class="chips" role="group" aria-label="Receta de">
        <span>Receta de:</span>
        ${ORIGENES.map(o => `<button class="chip" data-de="${esc(o)}" aria-pressed="${state.de === o}">${esc(o)}</button>`).join("")}
      </div>` : ""}
    </section>
    <section class="wrap grid">
      ${list.map(r => `
        <button class="card" data-go="${r.id}">
          <div class="pic" style="background:${r.color}">
            ${plato(r)}
            ${r.video ? `<span class="badge video">▶ Video</span>` : ""}
          </div>
          <h3>${esc(r.titulo)}</h3>
          <p>${esc(r.descripcion)}</p>
          <div class="meta">${tiempoDe(r) ? `<span>⏱ ${esc(tiempoDe(r))}</span>` : ""}${porcDe(r) ? `<span>🍽 ${porcDe(r)} porciones</span>` : ""}${r.facts && r.facts[0] ? `<span>${esc(r.facts[0][1])}</span>` : ""}<span>${esc(r.categoria)}</span></div>
        </button>`).join("") || `<p class="empty">No encontramos ${S.palabra} con esos filtros. Prueba con otra categoría o borra la búsqueda.</p>`}
    </section>
    ${sec === "recetas" && TRUCOS.length ? `<section class="wrap trucos" aria-labelledby="h-trucos">
      <h2 id="h-trucos">Trucos de la cocina</h2>
      ${xcards(TRUCOS)}
    </section>` : ""}`;
  setNav(sec);

  document.getElementById("q").addEventListener("input", e => {
    st.q = e.target.value;
    const pos = e.target.selectionStart;
    renderList(sec);
    const n = document.getElementById("q"); n.focus(); n.setSelectionRange(pos, pos);
  });
  app.querySelectorAll("[data-cat]").forEach(b => b.onclick = () => { st.cat = b.dataset.cat; renderList(sec); });
  app.querySelectorAll("[data-de]").forEach(b => b.onclick = () => { state.de = state.de === b.dataset.de ? null : b.dataset.de; renderList(sec); });
  app.querySelectorAll("[data-go]").forEach(b => b.onclick = () => { location.hash = b.dataset.go; });
}

function renderDetail(r) {
  const sec = seccionDe(r), S = SECCIONES[sec], esReceta = sec === "recetas";
  const ings = r.ingredientes || [], pasos = r.pasos || [];
  const s = state.servings[r.id] || r.porciones || 1;
  const k = !esReceta ? 1 : (r.porciones ? s / r.porciones : s);
  const stepBy = r.porciones ? 1 : 0.5;
  const sLabel = r.porciones ? `${s} porciones` : `Receta ×${fmt(s)}`;
  const ch = state.checks[r.id] || (state.checks[r.id] = { i: [], p: [] });
  const facts = r.facts || [
    ["Tiempo", tiempoDe(r)], ["Porciones", porcDe(r)], ["Dificultad", r.dificultad], ["Receta de", r.de]
  ];
  const aviso = avisoDe(r);

  app.innerHTML = `
    <article class="wrap recipe">
      <button class="back" id="back">${S.volver}</button>

      <section class="rhead">
        <div>
          <h1>${esc(r.titulo)}</h1>
          <p class="desc">${esc(r.descripcion)}</p>
          <div class="facts">
            ${facts.filter(f => f[1]).map(f => `<div class="fact"><b>${esc(f[0])}</b>${esc(f[1])}</div>`).join("")}
          </div>
          ${r.nota ? `<p class="note">${esc(r.nota)}<small>Nota de la receta</small></p>` : ""}
        </div>
        <div class="pic" style="background:${r.color}">${plato(r)}</div>
      </section>

      ${aviso ? `<p class="aviso">${aviso}</p>` : ""}

      ${ings.length ? `
      <section class="panel" aria-labelledby="h-ing">
        <div class="phead">
          <h2 id="h-ing">Ingredientes<span class="sub">${ch.i.length} de ${ings.length} listos</span></h2>
          ${esReceta ? `<div class="servings" role="group" aria-label="${r.porciones ? "Porciones" : "Tamaño de la receta"}">
            <button id="minus" aria-label="Reducir">−</button>
            <output aria-live="polite">${sLabel}</output>
            <button id="plus" aria-label="Aumentar">+</button>
          </div>` : ""}
        </div>
        <p class="hint">Toca cada ingrediente cuando lo tengas listo.</p>
        <div class="ings">
          ${ings.map((g, i) => `
            ${g.g ? `<h3 class="grp">${esc(g.g)}</h3>` : ""}
            <button class="ing" data-i="${i}" aria-pressed="${ch.i.includes(i)}">
              <span class="tick" aria-hidden="true">✓</span>
              <span class="e" aria-hidden="true">${g.e}</span>
              <span class="q">${cantidad(g, k)}</span>
              <span class="n">${esc(g.n)}</span>
            </button>`).join("")}
        </div>
      </section>` : ""}

      ${pasos.length ? `
      <section class="panel" aria-labelledby="h-pasos">
        <div class="phead"><h2 id="h-pasos">Pasos<span class="sub">${ch.p.length} de ${pasos.length} hechos</span></h2></div>
        <nav class="map" aria-label="Resumen de pasos">
          ${pasos.map((p, i) => `
            <button data-jump="${i}" class="${ch.p.includes(i) ? "done" : ""}">
              <span class="dot"><i>${i + 1}</i><span aria-hidden="true">${p.e}</span></span>
              ${esc(p.t)}
            </button>`).join("")}
        </nav>
        <div class="steps">
          ${pasos.map((p, i) => {
            const t = p.tt || (p.min ? tiempo(p.min) : "");
            return `
            <button class="step" id="paso-${i}" data-p="${i}" aria-pressed="${ch.p.includes(i)}">
              <span class="num"><span aria-hidden="true">${p.e}</span><i>${i + 1}</i></span>
              <span><h3>${esc(p.t)}</h3><p>${esc(p.d)}</p></span>
              ${t ? `<span class="time">⏱ ${esc(t)}</span>` : "<span></span>"}
            </button>`;
          }).join("")}
        </div>
      </section>` : ""}

      ${(r.extras || []).map((x, xi) => `
      <section class="panel" aria-labelledby="h-x${xi}">
        <div class="phead"><h2 id="h-x${xi}">${esc(x.titulo)}</h2></div>
        ${xcards(x.items)}
      </section>`).join("")}

      ${esReceta ? `
      <section class="panel" aria-labelledby="h-video">
        <div class="video">
          ${ytEmbed(r.video)
            ? `<iframe class="vbox" style="border:0;padding:0;width:100%" src="${ytEmbed(r.video)}" title="Video: ${esc(r.titulo)}" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`
            : `<div class="vbox"><div><div class="play" aria-hidden="true">▶</div>${r.video ? "Video disponible" : "Video próximamente"}</div></div>`}
          <div>
            <h2 id="h-video" style="font-size:1.6rem">Míralo en video</h2>
            <p style="color:var(--muted);max-width:42ch">${r.video
              ? "Prepárala conmigo paso a paso."
              : "Todavía no hemos grabado esta receta. Cuando la preparemos en casa, el video aparecerá aquí."}</p>
            ${r.video ? `<a class="btn" href="${esc(r.video)}" target="_blank" rel="noopener">▶ Ver el video</a>` : ""}
          </div>
        </div>
      </section>

      <div class="tags"><span>🏡 Receta de familia</span><span>🍽 ${esc(r.categoria)}</span>${tiempoDe(r) ? `<span>⏱ ${esc(tiempoDe(r))}</span>` : ""}</div>` : ""}
    </article>`;
  setNav(sec);

  document.getElementById("back").onclick = () => { location.hash = S.href === "#" ? "" : S.href.slice(1); };
  const minus = document.getElementById("minus"), plus = document.getElementById("plus");
  if (minus) minus.onclick = () => { state.servings[r.id] = Math.max(stepBy, s - stepBy); keep(() => renderDetail(r)); };
  if (plus) plus.onclick = () => { state.servings[r.id] = s + stepBy; keep(() => renderDetail(r)); };
  app.querySelectorAll("[data-i]").forEach(b => b.onclick = () => { toggle(ch.i, +b.dataset.i); keep(() => renderDetail(r)); });
  app.querySelectorAll("[data-p]").forEach(b => b.onclick = () => { toggle(ch.p, +b.dataset.p); keep(() => renderDetail(r)); });
  app.querySelectorAll("[data-jump]").forEach(b => b.onclick = () => {
    document.getElementById("paso-" + b.dataset.jump).scrollIntoView({ behavior: "smooth", block: "center" });
  });
}

function toggle(arr, v) { const i = arr.indexOf(v); i < 0 ? arr.push(v) : arr.splice(i, 1); saveChecks(); }
function keep(fn) { const y = window.scrollY; fn(); window.scrollTo(0, y); }

function route() {
  const id = location.hash.slice(1);
  if (id === "remedios") { renderList("remedios"); window.scrollTo(0, 0); return; }
  const r = RECETAS.find(x => x.id === id) || REMEDIOS.find(x => x.id === id);
  if (r) { renderDetail(r); window.scrollTo(0, 0); } else renderList("recetas");
}
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
