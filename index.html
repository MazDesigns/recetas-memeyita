<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f1e7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Memeyita">
<title>Recetas de Memeyita</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  /* Cocina de familia: crema cálido, verde hoja profundo, lima como acento de acción.
     Layout: inicio = filtros + rejilla de tarjetas; receta = cabecera visual, ingredientes en fichas, pasos numerados. */
  --bg: #f6f1e7;
  --surface: #efe7d8;
  --card: #fbf8f2;
  --ink: #1f2a1c;
  --muted: #6b6f5f;
  --green: #2f4a2a;
  --green-soft: #dfe6d3;
  --lime: #d9ef5b;
  --line: #e2d8c5;
  --display: "Fraunces", Georgia, "Times New Roman", serif;
  --body: "Outfit", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 18px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.5;
}
h1, h2, h3 { font-family: var(--display); font-weight: 600; text-wrap: balance; margin: 0; line-height: 1.1; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--green); outline-offset: 2px; border-radius: 8px; }
img { max-width: 100%; }

.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(20px, env(safe-area-inset-left)); padding-right: max(20px, env(safe-area-inset-right)); }

/* Barra superior */
.top { border-bottom: 1px solid var(--line); background: var(--bg); position: sticky; top: 0; z-index: 5; padding-top: env(safe-area-inset-top); }
.top .wrap { display: flex; align-items: center; justify-content: space-between; height: 64px; gap: 16px; }
.brand { font-family: var(--display); font-size: 1.35rem; color: var(--green); text-decoration: none; font-weight: 600; }
.brand small { display: block; font-family: var(--body); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.sections { display: flex; gap: 4px; background: var(--surface); border-radius: 999px; padding: 4px; }
.sections a { text-decoration: none; color: var(--muted); font-size: .9rem; padding: 6px 14px; border-radius: 999px; }
.sections a[aria-current="page"] { background: var(--green); color: #fff; }
.right { display: flex; align-items: center; gap: 8px; }
.lang { display: flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--card); }
.lang button { border: 0; background: none; font-size: .78rem; font-weight: 600; letter-spacing: .04em; padding: 5px 9px; border-radius: 999px; color: var(--muted); }
.lang button[aria-pressed="true"] { background: var(--lime); color: var(--ink); }
.badge.en { left: auto; right: 12px; background: #fff; color: var(--green); border: 1px solid var(--green-soft); }
.badge.chef { background: var(--green); color: #fff; text-transform: none; letter-spacing: 0; }
.sample.chef { border-radius: 10px; border-style: solid; background: var(--green-soft); border-color: var(--green-soft); color: var(--green); }
.langtags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.langtags .sample { margin: 0; }
.sample.en { border-style: solid; border-color: var(--green); color: var(--green); }
.aviso { margin: 0 0 8px; padding: 12px 16px; background: #fbf3d6; border: 1px solid #ecdfae; border-radius: 14px; font-size: .9rem; color: #5b5434; }
.recipe .aviso { margin: 0; }
.xcard p.solo { color: var(--ink); font-size: .98rem; }

/* Inicio */
.hero { padding-top: 48px; padding-bottom: 28px; display: grid; grid-template-columns: 1.2fr 1fr; gap: 32px; align-items: end; }
.hero h1 { font-size: clamp(2.2rem, 5vw, 3.6rem); color: var(--green); font-weight: 400; }
.hero h1 em { font-style: italic; font-weight: 600; }
.hero p { color: var(--muted); max-width: 46ch; margin: 14px 0 0; font-size: 1.05rem; }
.search { display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 12px 18px; }
.search input { border: 0; background: transparent; font: inherit; flex: 1; min-width: 0; color: var(--ink); outline: none; }
.search:focus-within { border-color: var(--green); }

.filters { display: flex; flex-direction: column; gap: 14px; padding-top: 8px; padding-bottom: 24px; }
.tabs { display: flex; gap: 22px; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
.tab { background: none; border: 0; padding: 8px 0 12px; font-family: var(--display); font-size: 1.35rem; color: #a9a593; border-bottom: 3px solid transparent; margin-bottom: -1px; }
.tab[aria-pressed="true"] { color: var(--ink); border-color: var(--green); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.chips span { font-size: .85rem; color: var(--muted); margin-right: 4px; }
.chip { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 14px; font-size: .9rem; }
.chip[aria-pressed="true"] { background: var(--green); color: #fff; border-color: var(--green); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 22px; padding-bottom: 48px; }
.card { background: none; border: 0; padding: 0; text-align: left; display: flex; flex-direction: column; gap: 12px; }
.card .pic { border-radius: var(--r); aspect-ratio: 5 / 4; display: grid; place-items: center; position: relative; transition: transform .2s; }
.card:hover .pic { transform: translateY(-3px); }
.card h3 { font-size: 1.3rem; }
.card p { margin: 0; color: var(--muted); font-size: .92rem; }
.meta { display: flex; gap: 14px; flex-wrap: wrap; font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.badge { position: absolute; top: 12px; left: 12px; background: var(--lime); color: var(--ink); font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; font-weight: 600; padding: 4px 10px; border-radius: 999px; }
.badge.video { left: auto; right: 12px; background: var(--green); color: #fff; }
.empty { grid-column: 1 / -1; text-align: center; padding: 40px; color: var(--muted); }

/* Plato ilustrado */
.plate { width: 66%; aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center;
  background: radial-gradient(circle, #fffdf8 0 58%, #f1ebdf 59% 66%, #fffdf8 67% 100%);
  box-shadow: 0 18px 30px -14px rgba(47, 74, 42, .45), 0 2px 0 rgba(0,0,0,.03); }
.plate span { font-size: clamp(3rem, 8vw, 5rem); line-height: 1; }
.plate img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }

/* Receta */
.recipe { padding-top: 20px; padding-bottom: 64px; display: flex; flex-direction: column; gap: 22px; }
.back { display: inline-flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px; font-size: .9rem; align-self: flex-start; }
.rhead { background: var(--card); border-radius: 28px; padding: 32px; display: grid; grid-template-columns: 1fr 1fr; gap: 28px; align-items: center; }
.rhead h1 { font-size: clamp(2rem, 4.5vw, 3.2rem); color: var(--green); }
.rhead .desc { color: var(--muted); max-width: 42ch; margin: 14px 0 18px; }
.rhead .pic { border-radius: 24px; aspect-ratio: 1; display: grid; place-items: center; }
.rhead .pic .plate { width: 78%; }
.facts { display: flex; flex-wrap: wrap; gap: 10px; }
.fact { background: var(--surface); border-radius: 12px; padding: 8px 14px; font-size: .9rem; }
.fact b { display: block; font-size: .7rem; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.note { margin: 18px 0 0; padding: 14px 18px; border-left: 3px solid var(--lime); background: var(--surface); border-radius: 0 12px 12px 0; font-family: var(--display); font-style: italic; font-size: 1.05rem; }
.note small { display: block; font-family: var(--body); font-style: normal; font-size: .8rem; color: var(--muted); margin-top: 4px; }
.sample { display: inline-block; font-size: .75rem; color: var(--muted); border: 1px dashed var(--muted); border-radius: 999px; padding: 2px 10px; margin-bottom: 12px; }

.panel { background: var(--card); border-radius: 24px; padding: 24px; }
.phead { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.phead h2 { font-size: 1.6rem; }
.phead .sub { font-size: .85rem; color: var(--muted); font-family: var(--body); font-weight: 400; margin-left: 8px; }
.servings { display: flex; align-items: center; gap: 4px; background: var(--surface); border-radius: 999px; padding: 4px; }
.servings button { width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--card); font-size: 1.1rem; }
.servings output { min-width: 96px; text-align: center; font-size: .9rem; font-variant-numeric: tabular-nums; }

.ings { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 12px; }
.ing { position: relative; background: var(--surface); border: 2px solid transparent; border-radius: 16px; padding: 16px 10px 12px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.ing .e { font-size: 2.4rem; line-height: 1.1; }
.ing .q { font-weight: 600; font-variant-numeric: tabular-nums; font-size: .95rem; }
.ing .n { font-size: .85rem; color: var(--muted); line-height: 1.3; }
.ing .tick { position: absolute; top: 8px; left: 8px; width: 22px; height: 22px; border-radius: 50%; border: 2px solid #c9bfa9; display: grid; place-items: center; font-size: .75rem; color: #fff; }
.ing[aria-pressed="true"] { border-color: var(--green); background: var(--green-soft); }
.ing[aria-pressed="true"] .tick { background: var(--green); border-color: var(--green); }

.map { display: flex; gap: 0; overflow-x: auto; padding: 4px 2px 14px; margin-bottom: 8px; }
.map button { flex: 1 0 104px; background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; position: relative; padding: 0 4px; font-size: .8rem; color: var(--muted); text-align: center; }
.map button::after { content: ""; position: absolute; top: 28px; left: calc(50% + 32px); right: calc(-50% + 32px); border-top: 2px dotted #c9bfa9; }
.map button:last-child::after { display: none; }
.map .dot { width: 56px; height: 56px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; font-size: 1.6rem; position: relative; }
.map .dot i { position: absolute; top: -4px; left: -4px; width: 22px; height: 22px; border-radius: 50%; background: var(--green); color: #fff; font-style: normal; font-size: .72rem; font-weight: 600; display: grid; place-items: center; }
.map button.done .dot { background: var(--green-soft); }

.steps { display: flex; flex-direction: column; gap: 12px; }
.step { display: grid; grid-template-columns: 56px 1fr auto; gap: 16px; align-items: start; background: var(--surface); border-radius: 16px; padding: 16px; border: 2px solid transparent; text-align: left; width: 100%; }
.step .num { width: 56px; height: 56px; border-radius: 14px; background: var(--card); display: grid; place-items: center; font-size: 1.7rem; position: relative; }
.step .num i { position: absolute; bottom: -6px; right: -6px; width: 24px; height: 24px; border-radius: 50%; background: var(--green); color: #fff; font-style: normal; font-size: .75rem; font-weight: 600; display: grid; place-items: center; }
.step h3 { font-family: var(--body); font-size: 1.05rem; font-weight: 600; margin-bottom: 4px; }
.step p { margin: 0; color: #3e4536; max-width: 65ch; }
.step .time { font-size: .8rem; background: var(--card); border-radius: 999px; padding: 4px 10px; white-space: nowrap; color: var(--muted); font-variant-numeric: tabular-nums; }
.step[aria-pressed="true"] { border-color: var(--green); background: var(--green-soft); }
.step[aria-pressed="true"] h3 { text-decoration: line-through; text-decoration-color: rgba(47,74,42,.5); }
.hint { font-size: .82rem; color: var(--muted); margin: 0 0 12px; }

.video { display: grid; grid-template-columns: 1fr 1.4fr; gap: 20px; align-items: center; }
.vbox { aspect-ratio: 16 / 9; border-radius: 16px; background: repeating-linear-gradient(-45deg, var(--surface) 0 14px, #e9e0cf 14px 28px); display: grid; place-items: center; text-align: center; color: var(--muted); padding: 16px; }
.vbox .play { width: 64px; height: 64px; border-radius: 50%; background: var(--card); display: grid; place-items: center; margin: 0 auto 8px; font-size: 1.4rem; color: var(--green); }
.btn { display: inline-flex; align-items: center; gap: 10px; background: var(--green); color: #fff; text-decoration: none; border-radius: 999px; padding: 12px 20px; font-weight: 500; }
.tags { display: flex; justify-content: center; gap: 28px; flex-wrap: wrap; background: var(--surface); border-radius: 999px; padding: 14px 20px; font-size: .9rem; color: var(--green); }

.grp { grid-column: 1 / -1; font-family: var(--body); font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin: 10px 0 0; }
.grp:first-child { margin-top: 0; }
.xgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.xcard { display: flex; gap: 14px; align-items: flex-start; background: var(--surface); border-radius: 16px; padding: 16px; }
.xcard .e { font-size: 1.8rem; line-height: 1; width: 48px; height: 48px; flex: none; display: grid; place-items: center; background: var(--card); border-radius: 12px; }
.xcard h3 { font-family: var(--body); font-size: 1rem; font-weight: 600; margin-bottom: 4px; }
.xcard p { margin: 0; color: #3e4536; font-size: .93rem; }
.trucos { padding-bottom: 48px; display: flex; flex-direction: column; gap: 16px; }
.trucos h2 { font-size: 1.6rem; color: var(--green); }

.sfotos { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.sfotos img { width: 180px; max-width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 12px; display: block; }
@media (max-width: 760px) { .sfotos img { width: calc(50% - 4px); } .sfotos img:only-child { width: 100%; } }

footer { border-top: 1px solid var(--line); padding-top: 24px; padding-bottom: calc(40px + env(safe-area-inset-bottom)); color: var(--muted); font-size: .85rem; }

@media (max-width: 760px) {
  .hero, .rhead, .video { grid-template-columns: 1fr; }
  .hero { padding-top: 32px; }
  .rhead { padding: 22px; }
  .rhead .pic { order: -1; aspect-ratio: 4 / 3; }
  .step { grid-template-columns: 48px 1fr; }
  .step .num { width: 48px; height: 48px; }
  .step .time { grid-column: 2; justify-self: start; }
  .panel { padding: 18px; }
  .tags { border-radius: 18px; }
  .top .wrap { flex-wrap: wrap; height: auto; padding-top: 10px; padding-bottom: 10px; row-gap: 8px; }
  .right { width: 100%; justify-content: space-between; }
  .brand { font-size: 1.12rem; white-space: nowrap; }
  .brand small { font-size: .62rem; }
  .sections a { padding: 6px 11px; font-size: .85rem; }
  .tabs { flex-wrap: nowrap; overflow-x: auto; gap: 18px; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { font-size: 1.15rem; white-space: nowrap; flex: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

<header class="top">
  <div class="wrap">
    <a class="brand" href="#">Recetas de Memeyita<small>Cocina de familia</small></a>
    <div class="right"><nav class="sections" aria-label="Secciones"><a href="#" data-sec="recetas">Recetas</a><a href="#remedios" data-sec="remedios">Remedios</a></nav><div class="lang" role="group" aria-label="Idioma"><button data-lang="es" aria-pressed="true">ES</button><button data-lang="en" aria-pressed="false">EN</button></div></div>
  </div>
</header>

<main id="app"></main>

<footer>
  <div class="wrap" id="pie"></div>
</footer>

<script>
/* ==========================================================
   CÓMO AGREGAR UNA RECETA
   Copia un bloque { ... } de la lista RECETAS y cambia los datos.
   - id: palabra corta sin espacios ni acentos (se usa en el enlace: #pan)
   - categoria: "Panes" | "Dulces" | "Platos fuertes" | (o crea otra)
   - de: quién la trae, por ejemplo "Mamá", "Abuela" o "La familia"
   - tiempoTexto / porcionesTexto: cómo se muestran el tiempo y las porciones
   - porciones: número (si lo pones, las cantidades se ajustan por porción)
   - ingredientes: c = cantidad (null = "al gusto", [1.5, 2] = rango)
                   g = título de grupo (se pone en el primer ingrediente del grupo)
   - extras: secciones como "Consejos", "Cubiertas" o "Variaciones"
   - video: enlace de YouTube cuando lo grabes (déjalo "" mientras tanto)
   - foto: opcional; ruta a una foto del plato (ej. "fotos/pan.jpg")

    pasos: [
      { e: "🌽", t: "Día 1 · Maíz para cuajar el guiso", d: "Lava el ½ taza de maíz pilado hasta que el agua salga clara, cúbrelo con 5–8 cm de agua y hiérvelo. Quita ¼ a ⅓ del agua caliente, completa con agua fría y deja enfriar. Para hallacas el maíz se cocina más que para arepas, así la masa queda más fina.", tt: "25 a 28 min" },
      { e: "🐖", t: "Día 2 · Precocer el cochino", d: "Quita el exceso de grasa, frota la carne con limón y enjuágala. Hiérvela junto con el tocino de los adornos, cubiertos de agua; debe quedar rosada. Déjala 5 minutos más en la olla, enfría, aparta el tocino y corta el cochino en trozos de unos 3 cm. Desecha el líquido.", tt: "7 a 8 min" },
      { e: "🐔", t: "Cocinar las gallinas", d: "Límpialas, frótalas con limón y cocina cada una en la olla de presión con 4 a 5 tazas de agua, hasta que ablanden sin pasarse. Reposa 10 minutos, quita la piel y desmenuza en trozos no muy pequeños. Guarda el caldo en la nevera.", min: 35 },
      { e: "🧅", t: "Hacer el sofrito", d: "Tritura los ajos con las alcaparras y ½ taza de caldo. En una olla grande (unos 12 litros, mejor de acero inoxidable) cocina el aceite con la cebolla, el ajo porro, el cebollín y la mezcla de ajo hasta que marchiten.", min: 15 },
      { e: "🍅", t: "Sazonar el guiso", d: "Agrega el pimentón, el tomate, los ajíes, los encurtidos, el vino, el vinagre, la salsa inglesa, el papelón, el pimentón y el ají secos, la pimienta, la sal, las 2 tazas de caldo y la mostaza. Deja hervir.", min: 10 },
      { e: "🥘", t: "Agregar las carnes", d: "Agrega el cochino y cocina 40 minutos. Luego la gallina, y cocina 30 a 40 minutos más revolviendo con cuidado para que no se desbarate. Prueba: la sazón debe quedar muy fuerte.", tt: "70 a 80 min" },
      { e: "🌽", t: "Cuajar el guiso", d: "Enjuaga y escurre el maíz del día 1, muélelo fino y tritúralo con 1½ taza de caldo. Agrégalo al guiso y cocina a fuego lento, revolviendo, hasta que espese y quede solo 1–2 cm de líquido encima. Tapa con un paño y deja enfriar en un lugar fresco hasta el día siguiente.", min: 30 },
      { e: "🥓", t: "Hacer la manteca", d: "Cocina el tocino picadito con 1½ taza de agua y la sal hasta que dore y ya no suelte grasa. Cuela, deja enfriar y guárdala tapada fuera de la nevera. Salen unas 5 tazas.", min: 30 },
      { e: "🌽", t: "Cocinar el maíz de la masa", d: "Lava los 2¼ kg de maíz, cúbrelo con 10 cm de agua y hiérvelo hasta que ablande con el centro un poco duro. Quita ¼ a ⅓ del agua, completa con agua fría y déjalo tapado hasta el día siguiente.", tt: "25 a 28 min" },
      { e: "🫑", t: "Preparar los adornos", d: "Hornea los pimentones untados en aceite a 180 °C (350 °F), dándoles vuelta; envuélvelos en un paño húmedo, pélalos y córtalos en tiras de 1 cm. Corta el tocino en tiritas de 4–5 cm. Pela las almendras escaldándolas unos segundos. Corta las cebollas en ruedas finas. Escurre alcaparras, aceitunas y encurtidos (en trocitos) y limpia las pasas. Guarda cada uno aparte en la nevera.", min: 50 },
      { e: "🌽", t: "Día 3 · Moler el maíz", d: "Lava y escurre el maíz, quítale los picos y pedacitos oscuros, y muélelo con el molino bien apretado para que la masa quede muy fina." },
      { e: "🟠", t: "Manteca con onoto", d: "Calienta 2 tazas de manteca con el onoto solo hasta que tome un color caramelo oscuro, sin quemarlo, y cuélala. Servirá para dar color a la masa y engrasar las hojas." },
      { e: "👐", t: "Amasar", d: "Incorpora al maíz unas 3 tazas de manteca sin color, 1 taza con onoto (según el color que quieras) y la sal. Amasa, vuelve a pasar por el molino, agrega las 3 tazas de caldo y amasa hasta que quede suave y compacta. Cúbrela con un paño húmedo." },
      { e: "🍃", t: "Preparar las hojas", d: "Clasifícalas en grandes (40 × 30 cm, para abajo y para la envoltura o camisa), medianas (20 × 25 cm, para las tapas) y fajas (10–15 cm de ancho). Lávalas, sécalas y engrasa con manteca de onoto el lado de los nervios marcados. Las fajas no se engrasan." },
      { e: "🫓", t: "Extender la masa", d: "Pon una bola de masa de 5–7 cm en el centro de una hoja grande, cúbrela con un plástico grueso y aplástala con una tabla, girándola un poco, hasta un círculo de 1–2 mm. Para las tapas usa bolitas de 3–4 cm." },
      { e: "🥘", t: "Rellenar", d: "Sobre la hoja con masa pon ½ taza de guiso frío y los adornos: 3 ruedas de cebolla, 2 tiras de pimentón, 2 de tocino, 2 aceitunas, 2 almendras, 4 alcaparras, 6 pasas y 4 o 5 trocitos de encurtido." },
      { e: "🎁", t: "Cerrar y amarrar", d: "Tapa con una hoja pequeña con masa y presiona los bordes. Dobla los lados y los extremos hacia arriba, envuelve en la camisa y luego en la faja. Amarra con pabilo cruzándolo 3 veces en cada sentido, terminando en el centro. Si una hoja se rompe, añade otra para que no entre agua." },
      { e: "♨️", t: "Hervir", d: "Mételas en agua hirviendo con sal, bien cubiertas y con trozos de hoja encima para que no floten. Tapa la olla.", tt: "1 h" },
      { e: "❄️", t: "Escurrir y guardar", d: "Sácalas y déjalas escurrir sobre una superficie inclinada. Cuando enfríen, guárdalas en la nevera: duran hasta 4 semanas, aunque después de la segunda toman sabor a hoja." },
      { e: "🍽️", t: "Calentar y servir", d: "Caliéntalas 15–20 minutos en agua hirviendo con sal y escúrrelas 1 minuto paradas; o envueltas en papel de aluminio, 30–35 minutos en el horno a 200 °C (400 °F); o al vapor. Desátalas, quita la faja y la camisa, corta los bordes de la hoja y sírvelas sobre su hoja." }

  "hallacas": {

    ing: ["The stew::Hulled white corn, to thicken the stew (or 200 g of corn dough)", "Lean leg of pork", "Boiling hens, about 2 kg each", "Lemon", "Oil", "Coarsely minced onion", "Leek (white part), finely chopped", "Spring onion, thinly sliced", "Peeled garlic cloves", "Small capers", "Red capsicum, minced, seeded", "Tomato, minced, peeled and seeded", "Ají dulce (sweet peppers), chopped", "Hot chilli, finely chopped", "Mustard pickles, blended", "Sweet wine (muscat or marsala)", "Vinegar", "Worcestershire sauce", "Papelón (unrefined cane sugar)", "Ground dried red capsicum (paprika)", "Ground dried chilli", "Freshly ground black pepper", "Salt", "Hen broth (plus ½ cup for the garlic and 1½ for the corn)", "Prepared mustard", "The dough::Pork fat for rendering (or 5 cups of lard)", "Water (for the lard)", "Salt (for the lard)", "Hulled white corn (or 5 kg of corn dough)", "Hen broth", "Salt", "Annatto seeds (onoto)", "The garnishes::Red capsicums", "Oil", "Bacon", "Almonds", "Small onions", "Small capers", "Medium olives", "Seedless raisins", "Pickles in vinegar, chopped", "To assemble::Banana leaves for hallacas", "Kitchen twine", "Salted water for boiling"],
    pasos: [
      ["Day 1 · Corn to thicken the stew", "Wash the ½ cup of hulled corn until the water runs clear, cover with 5–8 cm of water and boil. Pour off ¼ to ⅓ of the hot water, top up with cold water and let it cool. For hallacas the corn is cooked longer than for arepas, so the dough is finer.", "25 to 28 min"],
      ["Day 2 · Parboil the pork", "Trim the excess fat, rub the meat with lemon and rinse. Boil it with the bacon for the garnishes, covered with water; it should stay pink. Leave it 5 more minutes in the pot, cool, set the bacon aside and cut the pork into pieces of about 3 cm. Discard the liquid.", "7 to 8 min"],
      ["Cook the hens", "Clean them, rub with lemon and cook each in the pressure cooker with 4 to 5 cups of water until tender but not too soft. Rest 10 minutes, remove the skin and pull the meat into not-too-small pieces. Keep the broth in the fridge."],
      ["Make the sofrito", "Blend the garlic with the capers and ½ cup of broth. In a large pot (about 12 litres, ideally stainless steel) cook the oil with the onion, leek, spring onion and garlic mixture until soft."],
      ["Season the stew", "Add the capsicum, tomato, peppers, pickles, wine, vinegar, Worcestershire sauce, papelón, dried capsicum and chilli, pepper, salt, the 2 cups of broth and the mustard. Bring to the boil."],
      ["Add the meats", "Add the pork and cook 40 minutes. Then the hen, and cook 30 to 40 minutes more, stirring gently so it doesn't fall apart. Taste: the seasoning should be very strong.", "70 to 80 min"],
      ["Thicken the stew", "Rinse and drain the day-1 corn, grind it finely and blend with 1½ cups of broth. Add it to the stew and cook over low heat, stirring, until thick with only 1–2 cm of liquid on top. Cover with a cloth and leave to cool somewhere cool until the next day."],
      ["Render the lard", "Cook the chopped pork fat with 1½ cups of water and the salt until golden and no more fat comes out. Strain, cool and keep covered out of the fridge. You'll get about 5 cups."],
      ["Cook the corn for the dough", "Wash the 2¼ kg of corn, cover with 10 cm of water and boil until soft but still slightly firm in the centre. Pour off ¼ to ⅓ of the water, top up with cold water and leave covered until the next day.", "25 to 28 min"],
      ["Prepare the garnishes", "Roast the oiled capsicums at 180 °C (350 °F), turning them; wrap in a damp cloth, peel and cut into 1 cm strips. Cut the bacon into 4–5 cm strips. Blanch the almonds for a few seconds and peel. Slice the onions thinly. Drain the capers, olives and pickles (cut small) and pick over the raisins. Keep each one separately in the fridge."],
      ["Day 3 · Grind the corn", "Wash and drain the corn, remove the tips and dark bits, and grind it with the mill set tight so the dough is very fine."],

      ["Prepare the leaves", "Sort them into large (40 × 30 cm, for the base and the outer wrap), medium (20 × 25 cm, for the tops) and strips (10–15 cm wide). Wash, dry and grease the ribbed side with annatto lard. The strips aren't greased."],

      ["Close and tie", "Cover with a small dough-covered leaf and press the edges. Fold the sides and ends upwards, wrap in the outer leaf and then in a strip. Tie with twine, crossing it 3 times each way and finishing in the centre. If a leaf tears, add another so no water gets in."],
      ["Boil", "Put them into boiling salted water, well covered and with pieces of leaf on top so they don't float. Cover the pot.", "1 h"],
      ["Drain and store", "Take them out and drain on a sloping surface. Once cool, keep them in the fridge: they last up to 4 weeks, though after the second week they take on a leafy taste."],

/* Devuelve la receta en el idioma activo. Las recetas en español traen su inglés en TR_EN;
   las que son originalmente en inglés (idioma: "en") traen su español en r.tr. */
function loc(r) {
  const orig = r.idioma || "es";
  if (LANG === orig) return { ...r, _orig: orig, _tr: false };
  const tr = orig === "es" ? (typeof TR_EN !== "undefined" ? TR_EN[r.id] : null) : r.tr;
  if (!tr) return { ...r, _orig: orig, _tr: false };
  const o = { ...r, _orig: orig, _tr: true };
  ["titulo", "descripcion", "nota", "aviso", "tiempoTexto", "porcionesTexto", "facts"].forEach(k => { if (tr[k] !== undefined) o[k] = tr[k]; });
  if (r.ingredientes && tr.ing) o.ingredientes = r.ingredientes.map((g, i) => {
    const s = tr.ing[i]; if (!s) return g;
    const parts = s.split("::");
    return parts.length > 1 ? { ...g, g: parts[0], n: parts[1] } : { ...g, n: s };
  });
  if (r.pasos && tr.pasos) o.pasos = r.pasos.map((p, i) => {
    const q = tr.pasos[i]; if (!q) return p;
    return { ...p, t: q[0], d: q[1], tt: q[2] !== undefined ? q[2] : (p.tt ? undefined : p.tt) };
  });
  if (r.extras && tr.extras) o.extras = r.extras.map((x, j) => {
    const y = tr.extras[j]; if (!y) return x;
    return { titulo: y[0], items: x.items.map((it, k) => ({ ...it, t: it.t ? (y[1][k] && y[1][k][0]) || it.t : undefined, d: (y[1][k] && y[1][k][1]) || it.d })) };
  });
  return o;
}

function fmt(n) {
  const whole = Math.floor(n + 1e-9), frac = n - whole;
  const fr = [[0, ""], [0.25, "¼"], [1 / 3, "⅓"], [0.5, "½"], [2 / 3, "⅔"], [0.75, "¾"], [1, ""]];
  let best = fr[0];
  for (const f of fr) if (Math.abs(frac - f[0]) < Math.abs(frac - best[0])) best = f;
  if (n >= 20) return String(Math.round(n));
  const w = best[0] === 1 ? whole + 1 : whole;
  if (Math.abs(frac - best[0]) > 0.09) return LANG === "en" ? n.toFixed(1) : n.toFixed(1).replace(".", ",");
  return (w ? w : "") + best[1] || "0";
}

  const u = g.u ? unidad(g.u, hi > 1) : "";
  return num + (u ? " " + esc(u) : "");
}

  const aviso = avisoDe(r);

  app.innerHTML = `
    <article class="wrap recipe">
      <button class="back" id="back">${t(S.volver)}</button>

      <section class="rhead">
        <div>
          ${r._orig === "en" || r._tr || fuenteDe(r) ? `<div class="langtags">${fuenteDe(r) ? `<span class="sample chef">👨‍🍳 ${esc(fuenteDe(r)[LANG])}</span>` : ""}${r._orig === "en" ? `<span class="sample en">${t("originalEn")}</span>` : ""}${r._tr ? `<span class="sample">${t("traducidaDe")(r._orig)}</span>` : ""}</div>` : ""}
          <h1>${esc(r.titulo)}</h1>
          <p class="desc">${esc(r.descripcion)}</p>
          <div class="facts">
            ${facts.filter(f => f[1]).map(f => `<div class="fact"><b>${esc(f[0])}</b>${esc(f[1])}</div>`).join("")}
          </div>
          ${r.nota ? `<p class="note">${esc(r.nota)}<small>${t("notaReceta")}</small></p>` : ""}
        </div>
        <div class="pic" style="background:${r.color}">${plato(r)}</div>
      </section>

      ${aviso ? `<p class="aviso">${aviso}</p>` : ""}

      ${ings.length ? `
      <section class="panel" aria-labelledby="h-ing">
        <div class="phead">
          <h2 id="h-ing">${t("ingredientes")}<span class="sub">${t("listos")(ch.i.length, ings.length)}</span></h2>
          ${esReceta ? `<div class="servings" role="group" aria-label="${r.porciones ? t("porciones") : t("tamano")}">
            <button id="minus" aria-label="${t("reducir")}">−</button>
            <output aria-live="polite">${sLabel}</output>
            <button id="plus" aria-label="${t("aumentar")}">+</button>
          </div>` : ""}
        </div>
        <p class="hint">${t("hint")}</p>
        <div class="ings">
          ${ings.map((g, i) => `
            ${g.g ? `<h3 class="grp">${esc(g.g)}</h3>` : ""}
            <button class="ing" data-i="${i}" aria-pressed="${ch.i.includes(i)}">
              <span class="tick" aria-hidden="true">✓</span>
              <span class="e" aria-hidden="true">${g.e}</span>
              <span class="q">${cantidad(g, k)}</span>
              <span class="n">${esc(g.n)}</span>
            </button>`).join("")}
        </div>
      </section>` : ""}

      ${pasos.length ? `
      <section class="panel" aria-labelledby="h-pasos">
        <div class="phead"><h2 id="h-pasos">${t("pasos")}<span class="sub">${t("hechos")(ch.p.length, pasos.length)}</span></h2></div>
        <nav class="map" aria-label="${t("resumenPasos")}">
          ${pasos.map((p, i) => `
            <button data-jump="${i}" class="${ch.p.includes(i) ? "done" : ""}">
              <span class="dot"><i>${i + 1}</i><span aria-hidden="true">${p.e}</span></span>
              ${esc(p.t)}
            </button>`).join("")}
        </nav>
        <div class="steps">
          ${pasos.map((p, i) => {
            const tt = p.tt || (p.min ? tiempo(p.min) : "");
            return `
            <button class="step" id="paso-${i}" data-p="${i}" aria-pressed="${ch.p.includes(i)}">
              <span class="num"><span aria-hidden="true">${p.e}</span><i>${i + 1}</i></span>
              <span><h3>${esc(p.t)}</h3><p>${esc(p.d)}</p>${(p.fotos || []).length ? `<span class="sfotos">${p.fotos.map(f => `<img src="${f}" alt="${esc(t("fotoPaso")(p.t))}" loading="lazy">`).join("")}</span>` : ""}</span>
              ${tt ? `<span class="time">⏱ ${esc(tt)}</span>` : "<span></span>"}
            </button>`;
          }).join("")}
        </div>
      </section>` : ""}

      ${(r.extras || []).map((x, xi) => `
      <section class="panel" aria-labelledby="h-x${xi}">
        <div class="phead"><h2 id="h-x${xi}">${esc(x.titulo)}</h2></div>
        ${xcards(x.items)}
      </section>`).join("")}

      ${esReceta ? `
      <section class="panel" aria-labelledby="h-video">
        <div class="video">
          ${ytEmbed(r.video)
            ? `<iframe class="vbox" style="border:0;padding:0;width:100%" src="${ytEmbed(r.video)}" title="Video: ${esc(r.titulo)}" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`
            : `<div class="vbox"><div><div class="play" aria-hidden="true">▶</div>${r.video ? t("videoDisp") : t("videoProx")}</div></div>`}
          <div>
            <h2 id="h-video" style="font-size:1.6rem">${t("video")}</h2>
            <p style="color:var(--muted);max-width:42ch">${r.video ? t("videoSi") : t("videoNo")}</p>
            ${r.video ? `<a class="btn" href="${esc(r.video)}" target="_blank" rel="noopener">${t("verVideo")}</a>` : ""}
          </div>
        </div>
      </section>

      <div class="tags"><span>${fuenteDe(r) ? "👨‍🍳 " + esc(fuenteDe(r).chef) : t("recetaFamilia")}</span><span>🍽 ${esc(lbl(r.categoria))}</span>${tiempoDe(r) ? `<span>⏱ ${esc(tiempoDe(r))}</span>` : ""}</div>` : ""}
    </article>`;
  renderChrome(sec);

  document.getElementById("back").onclick = () => { location.hash = S.href === "#" ? "" : S.href.slice(1); };
  const minus = document.getElementById("minus"), plus = document.getElementById("plus");
  if (minus) minus.onclick = () => { state.servings[r.id] = Math.max(stepBy, s - stepBy); keep(() => renderDetail(base)); };
  if (plus) plus.onclick = () => { state.servings[r.id] = s + stepBy; keep(() => renderDetail(base)); };
  app.querySelectorAll("[data-i]").forEach(b => b.onclick = () => { toggle(ch.i, +b.dataset.i); keep(() => renderDetail(base)); });
  app.querySelectorAll("[data-p]").forEach(b => b.onclick = () => { toggle(ch.p, +b.dataset.p); keep(() => renderDetail(base)); });
  app.querySelectorAll("[data-jump]").forEach(b => b.onclick = () => {
    document.getElementById("paso-" + b.dataset.jump).scrollIntoView({ behavior: "smooth", block: "center" });
  });
}

function toggle(arr, v) { const i = arr.indexOf(v); i < 0 ? arr.push(v) : arr.splice(i, 1); saveChecks(); }
function keep(fn) { const y = window.scrollY; fn(); window.scrollTo(0, y); }

function route(resetScroll = true) {
  const id = location.hash.slice(1);
  if (id === "remedios") { renderList("remedios"); if (resetScroll) window.scrollTo(0, 0); return; }
  const r = RECETAS.find(x => x.id === id) || REMEDIOS.find(x => x.id === id);
  if (r) { renderDetail(r); if (resetScroll) window.scrollTo(0, 0); } else renderList("recetas");
}
document.querySelectorAll(".lang button").forEach(b => b.onclick = () => {
  LANG = b.dataset.lang;
  try { localStorage.setItem("memeyita-lang", LANG); } catch (e) {}
  keep(() => route(false));
});
window.addEventListener("hashchange", () => route());
route();
</script>
</body>
</html>
